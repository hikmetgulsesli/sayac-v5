<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-fixed-variant": "#005321",
              "on-secondary-fixed-variant": "#404754",
              "surface-dim": "#0c1324",
              "on-tertiary-container": "#860011",
              "primary": "#4be277",
              "on-secondary-fixed": "#151c27",
              "surface-container-lowest": "#070d1f",
              "on-secondary": "#2a313d",
              "on-error": "#690005",
              "on-tertiary-fixed-variant": "#930013",
              "outline-variant": "#3d4a3d",
              "secondary-fixed": "#dce2f3",
              "inverse-primary": "#006e2f",
              "secondary-container": "#404754",
              "error-container": "#93000a",
              "surface-container-low": "#151b2d",
              "on-background": "#dce1fb",
              "tertiary": "#ffb4ae",
              "surface-container-highest": "#2e3447",
              "on-tertiary-fixed": "#410004",
              "on-tertiary": "#68000a",
              "outline": "#869585",
              "surface-container-high": "#23293c",
              "surface-tint": "#4ae176",
              "tertiary-container": "#ff8a83",
              "tertiary-fixed": "#ffdad7",
              "inverse-on-surface": "#2a3043",
              "on-primary-fixed": "#002109",
              "on-primary-container": "#004b1e",
              "on-error-container": "#ffdad6",
              "on-primary": "#003915",
              "background": "#0c1324",
              "surface-variant": "#2e3447",
              "on-secondary-container": "#aeb5c5",
              "secondary": "#c0c7d6",
              "primary-fixed": "#6bff8f",
              "surface": "#0c1324",
              "inverse-surface": "#dce1fb",
              "primary-fixed-dim": "#4ae176",
              "surface-container": "#191f31",
              "on-surface": "#dce1fb",
              "surface-bright": "#33394c",
              "error": "#ffb4ab",
              "primary-container": "#22c55e",
              "on-surface-variant": "#bccbb9",
              "secondary-fixed-dim": "#c0c7d6",
              "tertiary-fixed-dim": "#ffb3ad"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        body {
            background-color: #020617;
            color: #dce1fb;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hero-glow {
            background: radial-gradient(circle at center, rgba(75, 226, 119, 0.08) 0%, transparent 70%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">
<!-- TopNavBar -->
<header class="w-full top-0 left-0 bg-[#0c1324] dark:bg-[#0c1324] flex justify-between items-center px-6 h-16 w-full z-50">
<div class="flex items-center gap-4">
<span class="text-xl font-black text-white dark:text-white tracking-tighter font-['Space_Grotesk'] font-bold uppercase tracking-widest">SAYAÇ</span>
</div>
<div class="flex items-center gap-2">
<button class="text-slate-400 hover:bg-[#23293c] transition-colors p-2 rounded-lg active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="text-slate-400 hover:bg-[#23293c] transition-colors p-2 rounded-lg active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- SideNavBar (Hidden on Mobile) -->
<aside class="hidden md:flex fixed left-0 top-0 h-screen w-64 flex-col py-8 bg-[#070d1f] border-r border-[#23293c]/20 z-40">
<div class="px-6 mb-10">
<span class="text-2xl font-bold text-white font-['Inter'] text-sm tracking-wide">SAYAÇ</span>
</div>
<nav class="flex-1 space-y-1">
<a class="flex items-center gap-4 px-6 py-3 text-[#22c55e] font-bold border-r-4 border-[#22c55e] transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Inter'] text-sm tracking-wide">Ana Sayfa</span>
</a>
<a class="flex items-center gap-4 px-6 py-3 text-slate-500 hover:text-white hover:bg-[#191f31] transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-['Inter'] text-sm tracking-wide">Geçmiş</span>
</a>
<a class="flex items-center gap-4 px-6 py-3 text-slate-500 hover:text-white hover:bg-[#191f31] transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="target">target</span>
<span class="font-['Inter'] text-sm tracking-wide">Hedefler</span>
</a>
<a class="flex items-center gap-4 px-6 py-3 text-slate-500 hover:text-white hover:bg-[#191f31] transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Inter'] text-sm tracking-wide">Ayarlar</span>
</a>
</nav>
<div class="px-6 mt-auto flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="Kullanıcı Profili" data-alt="close-up portrait of a professional man in a dark environment with dramatic soft studio lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBhdYsOP1fF69htAIFP0Fm7Z_Sh0uObgfIgewGaQOmrsc4koDHeRC1_xdj2VOLClmyyE90kS1h8U7WJKxHIzB6d-jsDldtnEuGFwpA-RIrhuu8ubolRgLIUaZP8OVH12UckAclaeUYR8juGV1ZeuQCv-m9ghWV9TbG55_j-c0cDquDX0a-9A_dwfzRStrWAIjfS58QK5xKDBgB5NtrAf5gAFbWpnUXFiks05v9zdFiPf2qehtDLjPGr7eSp0Tu8cEEpPouLPHeJ8KM"/>
</div>
<div>
<p class="text-sm font-bold text-white">Hesap</p>
<p class="text-xs text-slate-500">Premium Üye</p>
</div>
</div>
</aside>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-6 md:ml-64 relative">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 hero-glow pointer-events-none"></div>
<div class="w-full max-w-2xl text-center space-y-12 relative z-10">
<!-- Header/Empty State Label -->
<div class="space-y-2">
<span class="text-primary font-['Inter'] font-bold tracking-[0.2em] text-xs uppercase">ŞU ANKİ DURUM</span>
<h1 class="text-on-surface/60 font-['Inter'] text-lg font-medium">Henüz bir veri girişi yapılmadı</h1>
</div>
<!-- Massive Kinetic Counter -->
<div class="flex flex-col items-center justify-center">
<div class="relative">
<span class="text-[12rem] md:text-[18rem] font-['Space_Grotesk'] font-bold leading-none tracking-tighter text-white select-none">
                        0
                    </span>
<!-- Decorative Element -->
<div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-24 h-1 bg-primary/30 rounded-full blur-sm"></div>
</div>
</div>
<!-- Editorial Action Group -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-lg mx-auto pt-8">
<!-- Decrement Button -->
<button class="group flex items-center justify-center gap-3 px-8 py-5 bg-surface-container hover:bg-surface-container-high text-error rounded-xl transition-all duration-200 active:scale-95 border border-error/10 hover:border-error/30">
<span class="material-symbols-outlined text-2xl" data-icon="remove">remove</span>
<span class="font-['Inter'] font-bold text-sm tracking-wider">-1</span>
</button>
<!-- Increment Button (Signature CTA) -->
<button class="group flex items-center justify-center gap-3 px-8 py-5 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-xl transition-all duration-200 active:scale-95 shadow-lg shadow-primary/10 hover:shadow-primary/20">
<span class="material-symbols-outlined text-2xl" data-icon="add">add</span>
<span class="font-['Inter'] font-bold text-sm tracking-wider">+1</span>
</button>
<!-- Reset Button -->
<button class="group flex items-center justify-center gap-3 px-8 py-5 bg-surface-container hover:bg-surface-container-high text-slate-400 hover:text-white rounded-xl transition-all duration-200 active:scale-95 border border-white/5 hover:border-white/10">
<span class="material-symbols-outlined text-2xl" data-icon="restart_alt">restart_alt</span>
<span class="font-['Inter'] font-bold text-sm tracking-wider">Sıfırla</span>
</button>
</div>
</div>
<!-- Metric Details (Editorial Utility Pattern) -->
<div class="mt-24 grid grid-cols-2 md:grid-cols-4 gap-8 w-full max-w-4xl px-4">
<div class="flex flex-col items-start gap-1">
<span class="text-[2rem] font-['Space_Grotesk'] font-bold text-white">0%</span>
<span class="text-[0.65rem] font-['Inter'] font-bold text-slate-500 uppercase tracking-widest">VERİMLİLİK</span>
</div>
<div class="flex flex-col items-start gap-1">
<span class="text-[2rem] font-['Space_Grotesk'] font-bold text-white">--</span>
<span class="text-[0.65rem] font-['Inter'] font-bold text-slate-500 uppercase tracking-widest">SON AKTİVİTE</span>
</div>
<div class="flex flex-col items-start gap-1">
<span class="text-[2rem] font-['Space_Grotesk'] font-bold text-white">0.0</span>
<span class="text-[0.65rem] font-['Inter'] font-bold text-slate-500 uppercase tracking-widest">ORTALAMA</span>
</div>
<div class="flex flex-col items-start gap-1">
<span class="text-[2rem] font-['Space_Grotesk'] font-bold text-white">--</span>
<span class="text-[0.65rem] font-['Inter'] font-bold text-slate-500 uppercase tracking-widest">ZİRVE DEĞER</span>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-[#0c1324] flex justify-around items-center h-16 px-4 z-50">
<a class="flex flex-col items-center gap-1 text-[#22c55e]" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-medium font-['Inter']">Ana Sayfa</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="text-[10px] font-medium font-['Inter']">Geçmiş</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined" data-icon="target">target</span>
<span class="text-[10px] font-medium font-['Inter']">Hedefler</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-[10px] font-medium font-['Inter']">Ayarlar</span>
</a>
</nav>
</body></html>
