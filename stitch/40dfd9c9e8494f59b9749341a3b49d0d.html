<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-low": "#151b2d",
                        "outline": "#869585",
                        "on-surface-variant": "#bccbb9",
                        "on-primary-fixed": "#002109",
                        "on-tertiary": "#68000a",
                        "secondary-container": "#404754",
                        "on-primary-container": "#004b1e",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "tertiary": "#ffb4ae",
                        "tertiary-container": "#ff8a83",
                        "primary-fixed": "#6bff8f",
                        "on-surface": "#dce1fb",
                        "on-error": "#690005",
                        "surface": "#0c1324",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#410004",
                        "surface-bright": "#33394c",
                        "surface-container": "#191f31",
                        "inverse-primary": "#006e2f",
                        "on-tertiary-fixed-variant": "#930013",
                        "on-primary": "#003915",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#ffdad7",
                        "on-primary-fixed-variant": "#005321",
                        "on-background": "#dce1fb",
                        "surface-container-highest": "#2e3447",
                        "outline-variant": "#3d4a3d",
                        "surface-container-lowest": "#070d1f",
                        "surface-dim": "#0c1324",
                        "secondary-fixed": "#dce2f3",
                        "on-secondary-container": "#aeb5c5",
                        "surface-container-high": "#23293c",
                        "on-secondary-fixed-variant": "#404754",
                        "on-secondary": "#2a313d",
                        "secondary-fixed-dim": "#c0c7d6",
                        "error": "#ffb4ab",
                        "inverse-on-surface": "#2a3043",
                        "on-tertiary-container": "#860011",
                        "inverse-surface": "#dce1fb",
                        "surface-variant": "#2e3447",
                        "primary": "#4be277",
                        "primary-container": "#22c55e",
                        "secondary": "#c0c7d6",
                        "background": "#0c1324",
                        "on-secondary-fixed": "#151c27",
                        "surface-tint": "#4ae176",
                        "primary-fixed-dim": "#4ae176"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        body {
            background-color: #070d1f; /* surface-container-lowest */
            color: #dce1fb;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-bg {
            background: radial-gradient(circle at 50% 50%, #191f31 0%, #0c1324 100%);
        }
    </style>
</head>
<body class="font-body selection:bg-primary selection:text-on-primary">
<!-- TopNavBar Implementation -->
<header class="bg-[#0c1324] font-['Space_Grotesk'] tracking-tight flex justify-between items-center w-full px-6 py-4 fixed top-0 z-50">
<div class="text-2xl font-bold tracking-tighter text-[#4be277] uppercase">SAYAÇ</div>
<div class="flex items-center gap-6">
<button class="text-[#f5f7fa] opacity-60 hover:bg-[#23293c] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-[#191f31]">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="Professional male portrait with neutral expression, high-end studio lighting, minimalist dark background, crisp details" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqJDSPUJbob9lTAaxNrGNlaKG5xiJhZRdtH6jNYlGrMGBFPo1DExMG9j4_eaD5ECe1cKYDWSfJkmltV2KotijyTA1t4LBg6sep3JO5qSuklulA1vFPahSgLObQEZuWkF92n9ea2DojlKVwUbIJu4YZIo2e_GqRhIuxI3RNdRV_2PgoLIumyg1jMJNjFY_fIiZN7eFr7crDPCr0sj0TLkapH_LJ5Y7ywMR4kusnFafb_Ij5B-G60ckoIpDDrL1vCMkwCevi8N4Renw"/>
</div>
</div>
</header>
<!-- SideNavBar Implementation (Desktop) -->
<aside class="hidden md:flex bg-[#070d1f] fixed left-0 top-0 h-screen w-64 flex-col p-6 z-40 font-['Inter'] font-medium uppercase tracking-[0.05em]">
<div class="mb-12 mt-20">
<div class="flex items-center gap-4 mb-8">
<div class="w-12 h-12 rounded-lg bg-[#191f31] flex items-center justify-center text-[#4be277]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div>
<div class="text-sm text-[#f5f7fa]">Kullanıcı</div>
<div class="text-[10px] text-[#4be277]">Premium Üye</div>
</div>
</div>
<nav class="space-y-4">
<a class="flex items-center gap-4 p-3 text-[#4be277] border-r-4 border-[#4be277] bg-[#191f31]/50 transition-all active:translate-x-1 duration-150" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-xs">Ana Sayfa</span>
</a>
<a class="flex items-center gap-4 p-3 text-[#f5f7fa] opacity-50 hover:bg-[#191f31] hover:opacity-100 transition-all active:translate-x-1 duration-150" href="#">
<span class="material-symbols-outlined">history</span>
<span class="text-xs">Geçmiş</span>
</a>
<a class="flex items-center gap-4 p-3 text-[#f5f7fa] opacity-50 hover:bg-[#191f31] hover:opacity-100 transition-all active:translate-x-1 duration-150" href="#">
<span class="material-symbols-outlined">track_changes</span>
<span class="text-xs">Hedefler</span>
</a>
<a class="flex items-center gap-4 p-3 text-[#f5f7fa] opacity-50 hover:bg-[#191f31] hover:opacity-100 transition-all active:translate-x-1 duration-150" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-xs">Ayarlar</span>
</a>
</nav>
</div>
<div class="mt-auto">
<a class="flex items-center gap-4 p-3 text-[#f5f7fa] opacity-50 hover:bg-[#191f31] hover:opacity-100 transition-all" href="#">
<span class="material-symbols-outlined">help</span>
<span class="text-xs">Yardım</span>
</a>
</div>
</aside>
<!-- Main Content Area -->
<main class="min-h-screen pt-24 pb-12 px-6 md:pl-72 kinetic-bg flex flex-col items-center justify-center">
<!-- Kinetic Monolith: The Primary Counter -->
<div class="w-full max-w-4xl mx-auto flex flex-col items-center">
<!-- Headline Hero Section -->
<div class="relative flex flex-col items-center mb-16">
<!-- Data Visualization: The '42' -->
<div class="font-headline text-[12rem] md:text-[18rem] leading-none font-bold tracking-tighter text-white drop-shadow-[0_0_40px_rgba(75,226,119,0.1)]">
                    42
                </div>
<!-- Trend Pill -->
<div class="absolute -bottom-4 bg-primary/10 border border-primary/20 backdrop-blur-md px-6 py-2 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">trending_up</span>
<span class="font-label text-xs font-bold text-primary tracking-widest uppercase">+12% BUGÜN</span>
</div>
</div>
<!-- Kinetic Action Controls -->
<div class="w-full max-w-md flex flex-col gap-8">
<div class="flex gap-4">
<!-- Primary Increment -->
<button class="flex-1 h-24 bg-gradient-to-br from-primary to-primary-container rounded-xl flex items-center justify-center text-on-primary active:scale-95 transition-all shadow-xl shadow-primary/10">
<span class="material-symbols-outlined text-4xl font-bold">add</span>
<span class="font-headline text-3xl font-bold ml-2">+1</span>
</button>
<!-- Secondary Decrement -->
<button class="flex-1 h-24 bg-surface-container-high rounded-xl flex items-center justify-center text-on-surface hover:bg-surface-bright active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl font-bold">remove</span>
<span class="font-headline text-3xl font-bold ml-2">-1</span>
</button>
</div>
<!-- Reset Action -->
<button class="self-center font-label text-xs tracking-[0.2em] uppercase text-on-surface/40 hover:text-primary transition-colors py-2 active:scale-90">
                    Sıfırla
                </button>
</div>
</div>
<!-- Metric Cards: Bento Grid Style -->
<div class="w-full max-w-5xl mt-24 grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Metric Card 1 -->
<div class="bg-surface-container p-8 rounded-xl flex flex-col justify-between hover:bg-surface-container-high transition-colors group">
<div class="flex justify-between items-start mb-4">
<span class="material-symbols-outlined text-on-surface/30 group-hover:text-primary transition-colors">schedule</span>
<div class="w-2 h-2 rounded-full bg-primary/40 animate-pulse"></div>
</div>
<div>
<div class="font-headline text-4xl text-white mb-1">08:45</div>
<div class="font-label text-[10px] tracking-widest uppercase text-on-surface/50">Son Güncelleme</div>
</div>
</div>
<!-- Metric Card 2 -->
<div class="bg-surface-container p-8 rounded-xl flex flex-col justify-between hover:bg-surface-container-high transition-colors group">
<div class="flex justify-between items-start mb-4">
<span class="material-symbols-outlined text-on-surface/30 group-hover:text-primary transition-colors">bar_chart</span>
<span class="text-[10px] font-bold text-primary">+8</span>
</div>
<div>
<div class="font-headline text-4xl text-white mb-1">128</div>
<div class="font-label text-[10px] tracking-widest uppercase text-on-surface/50">Günlük Toplam</div>
</div>
</div>
<!-- Metric Card 3 -->
<div class="bg-surface-container p-8 rounded-xl flex flex-col justify-between hover:bg-surface-container-high transition-colors group">
<div class="flex justify-between items-start mb-4">
<span class="material-symbols-outlined text-on-surface/30 group-hover:text-primary transition-colors">flag</span>
<span class="text-[10px] font-bold text-on-surface/30">16.8%</span>
</div>
<div>
<div class="font-headline text-4xl text-white mb-1">250</div>
<div class="font-label text-[10px] tracking-widest uppercase text-on-surface/50">Hedef Sayaç</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-[#191f31]/90 backdrop-blur-xl flex justify-around items-center p-4 z-50">
<a class="text-[#4be277] flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</a>
<a class="text-[#f5f7fa] opacity-60 flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined">history</span>
</a>
<a class="text-[#f5f7fa] opacity-60 flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined">track_changes</span>
</a>
<a class="text-[#f5f7fa] opacity-60 flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined">settings</span>
</a>
</nav>
</body></html>
