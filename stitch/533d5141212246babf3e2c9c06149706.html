</div>
<section class="relative z-10 w-full max-w-4xl flex flex-col items-center gap-12">

<span class="text-xl font-['Inter']">+1</span>
</button>
<button class="group flex items-center justify-center gap-3 py-6 px-8 bg-surface-container-highest text-white font-bold rounded-xl transition-all duration-150 active:scale-95 hover:bg-error-container/20 hover:text-error">

<span class="text-xl font-['Inter']">-1</span>

</button>

<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">AYARLAR</span>

<button class="fixed bottom-20 right-6 md:bottom-10 md:right-10 w-14 h-14 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-2xl shadow-primary/40 active:scale-90 transition-transform duration-150 z-40">
